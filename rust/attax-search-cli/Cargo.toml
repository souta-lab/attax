[package]
name = "attax-search-cli"
version = "0.1.0"
edition = "2024"
description = "JSON front end for attax-search: TS/Rust agreement harness and timing."

[[bin]]
name = "attax-agree"
path = "src/main.rs"

[dependencies]
attax-search = { path = "../attax-search" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
