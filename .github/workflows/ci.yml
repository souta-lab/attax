name: CI

# NOTE: this repo's GitHub account currently has a billing issue that prevents
# Actions from starting ("recent account payments have failed"). The workflow is
# kept on manual dispatch so it does not spam failed checks on every push; switch
# `on:` back to push/pull_request once billing is restored.
on:
  workflow_dispatch:

jobs:
  web:
    name: TypeScript (tsc, test, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - run: bun run lint

  rust:
    name: Rust (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --manifest-path rust/Cargo.toml
